global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Fichiers de règles d'alerte
rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'bike_api'
    static_configs:
      - targets: ['bike-api:8080']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
